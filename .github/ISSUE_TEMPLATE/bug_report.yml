name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not file an issue. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Login mode
      options: [Secondary (Cloudflare alongside WordPress login), Primary (Cloudflare only)]
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How was the Cloudflare application created?
      options: [Automatic setup in the wizard, Manually in the Cloudflare dashboard]
  - type: input
    id: environment
    attributes:
      label: WordPress and PHP versions
      placeholder: "WordPress 6.8, PHP 8.2, behind Cloudflare proxy: yes"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Tools → CF Zero Trust Logs, or the PHP error log. Remove anything sensitive.
      render: text
