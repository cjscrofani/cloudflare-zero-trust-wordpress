# Local test environment for the Cloudflare Zero Trust Login plugin.
#
# Run everything through .dev/bin/dev rather than calling compose directly.
# The plugin is bind-mounted from the repo root, so edits on the host are live
# in the container with no rebuild.
name: cfzt

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      SITE_URL: ${SITE_URL:-https://cfzt.local}
      WORDPRESS_DEBUG: 1
      # Appended verbatim into wp-config.php by the official image.
      WORDPRESS_CONFIG_EXTRA: |
        /* Pin the site URL so Cloudflare redirects land where we expect. */
        define('WP_HOME', getenv('SITE_URL'));
        define('WP_SITEURL', getenv('SITE_URL'));

        /* TLS terminates at the proxy (OrbStack or cloudflared), so without
           this is_ssl() returns false and WordPress redirect-loops. The plugin
           also gates several warnings on is_ssl(). */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO']) {
            $$_SERVER['HTTPS'] = 'on';
        }

        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', false);
    labels:
      # OrbStack serves this name over HTTPS with its own trusted CA.
      dev.orbstack.domains: ${DEV_DOMAIN:-cfzt.local}
    volumes:
      - wp:/var/www/html
      # Writable on purpose: the plugin regenerates assets/js/cfzt-admin.js.
      - ../:/var/www/html/wp-content/plugins/cloudflare-zero-trust-login

  # One-shot WP-CLI runner: `.dev/bin/dev wp <args>`
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      SITE_URL: ${SITE_URL:-https://cfzt.local}
    volumes:
      - wp:/var/www/html
      - ../:/var/www/html/wp-content/plugins/cloudflare-zero-trust-login
    user: "33:33"

  # Optional: a real public HTTPS hostname, for the end-to-end login test.
  # Needs TUNNEL_TOKEN in .dev/.env — see .dev/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - wordpress
    # Deliberately not ${VAR:?...}: compose interpolates every service even for
    # inactive profiles, so a required variable here would break plain `up`.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}

volumes:
  db:
  wp:
